<body>
<title>냥이 키우기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: phone-first life sim — household roster, selected cat's needs, room/outdoor stage, action pad, bottom sheets for interactions */
:root{
  --bg:#e8f1ee; --room:#f7efe0; --wall2:#efe3cd; --floor:#d9c3a0; --ink:#2f3a3a; --muted:#6c7b78;
  --card:#ffffff; --line:#d6e2de; --accent:#f2a93b; --accent-ink:#3b2a0a; --sel:#3fb27f;
  --sky:#bfe3f5; --sky2:#e6f4fb; --path:#c9b48d; --grass:#9fd08a; --bad:#d9534f;
  --hunger:#ef8a5b; --fun:#e86aa0; --clean:#4fb3c9; --energy:#8a7bd8; --social:#5dbb63;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif; --body:"Gowun Dodum",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161d24; --room:#2a3442; --wall2:#25303c; --floor:#433a2d; --ink:#eef2f1; --muted:#9fb0b6;
  --card:#1f2832; --line:#33404c; --accent:#f2b04a; --accent-ink:#2a1d05; --sel:#4fc68f;
  --sky:#2f4470; --sky2:#3b5585; --path:#5b4e38; --grass:#3f6b3a; --bad:#ef6f6a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161d24; --room:#2a3442; --wall2:#25303c; --floor:#433a2d; --ink:#eef2f1; --muted:#9fb0b6;
  --card:#1f2832; --line:#33404c; --accent:#f2b04a; --accent-ink:#2a1d05; --sel:#4fc68f;
  --sky:#2f4470; --sky2:#3b5585; --path:#5b4e38; --grass:#3f6b3a; --bad:#ef6f6a; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:center;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit}
.app{width:100%;max-width:460px;display:flex;flex-direction:column;gap:10px;padding-block:12px 20px}
h1{font-family:var(--display);font-weight:400;font-size:24px;margin:0;line-height:1;white-space:nowrap}
@media (max-width:420px){h1{font-size:20px}.chips{gap:4px;font-size:12px}.chips span{padding:3px 7px}.savebtn{padding:3px 8px}}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chips{display:flex;gap:6px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chips span{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 9px;white-space:nowrap}
.chips b{font-family:var(--display);font-weight:400;color:var(--ink)}
/* roster */
.roster{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.roster::-webkit-scrollbar{display:none}
.rc{flex:0 0 auto;width:58px;border:2px solid transparent;background:var(--card);border-radius:12px;padding:2px 2px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;position:relative}
.rc.on{border-color:var(--sel)}
.rc svg{width:50px;height:45px}
.rc small{font-size:11px;max-width:54px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc .badge{position:absolute;top:-4px;right:-3px;font-size:13px}
.rc.away{opacity:.45}
/* needs */
.needs{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.nh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.nh .nm{font-family:var(--display);font-size:18px}
.nh .sub{font-size:12px;color:var(--muted);text-align:right}
.mood{font-family:var(--display);font-size:13px;padding:1px 8px;border-radius:99px;color:#fff}
.bars{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:3px;min-width:0}
.stat .lab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;transition:width .4s}
.bar i.low{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
/* stage */
.stage{position:relative;height:330px;border-radius:18px;overflow:hidden;background:var(--room);border:1px solid var(--line)}
.wallpaper{position:absolute;inset:0 0 36% 0;background:repeating-linear-gradient(90deg,var(--room) 0 26px,var(--wall2) 26px 52px)}
.floor{position:absolute;left:0;right:0;bottom:0;height:36%;background:var(--floor)}
.window{position:absolute;top:20px;left:20px;width:80px;height:66px;border-radius:8px;border:5px solid var(--card);background:var(--sky)}
.window::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--card)}
.window .moon{position:absolute;top:8px;right:8px;width:16px;height:16px;border-radius:50%;background:#f8e7a0}
.furni{position:absolute;font-size:34px}
.cat{position:absolute;transform:translateX(-50%);cursor:pointer;transition:left 2.4s ease-in-out,bottom .7s cubic-bezier(.3,1.6,.5,1)}
.cat svg{display:block;width:100%;height:auto;overflow:visible}
.cat.sel::before{content:"";position:absolute;left:18%;right:18%;bottom:-4px;height:10px;border-radius:50%;background:var(--sel);opacity:.55}

<script>
/* ===== data ===== */
const KEY="nyang-town-v2", OLD="nyang-game-v1", MAX=12, GROW=4*60*1000, PREG=15*1000;
const NEEDS=[
  {k:"hunger",n:"배부름",c:"var(--hunger)",r:.06,i:"🐟"},
  {k:"fun",n:"즐거움",c:"var(--fun)",r:.05,i:"🧶"},
  {k:"clean",n:"청결",c:"var(--clean)",r:.03,i:"🫧"},
  {k:"energy",n:"기운",c:"var(--energy)",r:.04,i:"💤"},
  {k:"social",n:"사교",c:"var(--social)",r:.04,i:"💬"},
];
const TRAITS={
  "먹보":{d:"배가 금방 고파요",m:{hunger:1.5}},
  "장난꾸러기":{d:"심심함을 못 참아요",m:{fun:1.5}},
  "깔끔쟁이":{d:"더러운 건 질색이에요",m:{clean:1.6}},
  "잠꾸러기":{d:"자주 졸려 해요",m:{energy:1.5}},
  "애교쟁이":{d:"친구를 잘 사귀어요",m:{social:1.3}},
  "새침데기":{d:"마음을 쉽게 안 열어요",m:{social:.7}},
};
const NAMES=["나비","보리","콩이","두부","모찌","까미","호떡","망고","라떼","율무","찹쌀","밤톨","도토리","구름","별이","쿠키","감자","루루","순대","젤리","토리","단추","후추","깨비","솜이","만두","치치","호두"];
const BODIES=["#f0a64a","#8f9aa3","#2d2a2e","#f6f3ee","#e9d3b0","#8a5a3b","#c3c9cf","#d98a3d"];
const EYES=["#e8b33a","#7cc26b","#6fb4e6","#c98a3a"];
const PATTERNS=["solid","tabby","tabby","tuxedo","socks","calico"];
const PAT_NAME={solid:"단색",tabby:"줄무늬",tuxedo:"턱시도",socks:"양말",calico:"얼룩"};
const PRESETS=[
  {name:"치즈",fur:{body:"#f0a64a",pattern:"tabby",eye:"#7cc26b"}},
  {name:"고등어",fur:{body:"#8f9aa3",pattern:"tabby",eye:"#e8b33a"}},
  {name:"까망",fur:{body:"#2d2a2e",pattern:"tuxedo",eye:"#e8b33a"}},
  {name:"하양",fur:{body:"#f6f3ee",pattern:"solid",eye:"#6fb4e6"}},
];

/* ===== helpers ===== */
const $=id=>document.getElementById(id);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=v=>Math.max(0,Math.min(100,v));
const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const hex=a=>"#"+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0")).join("");
const mix=(a,b,t)=>{const x=rgb(a),y=rgb(b);return hex(x.map((v,i)=>v+(y[i]-v)*t));};
const lum=h=>{const [r,g,b]=rgb(h);return (r*.3+g*.59+b*.11)/255;};
function jo(w,a,b){const c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return w+b;return w+((c-0xAC00)%28?a:b);}
const ga=w=>jo(w,"이","가"), wa=w=>jo(w,"과","와"), eul=w=>jo(w,"을","를"), neun=w=>jo(w,"은","는");
function fullFur(f){
  const dark=mix(f.body,"#000000",lum(f.body)<.25?.45:.3);
  const belly=mix(f.body,"#ffffff",lum(f.body)<.25?.18:.6);
  return {...f,dark,belly,line:mix(f.body,"#000000",.45),spot:f.spot||"#2d2a2e"};
}
function randomFur(){
  const pattern=pick(PATTERNS);
  return {body:pick(BODIES),pattern,eye:pick(EYES),spot:pattern==="calico"?pick(["#2d2a2e","#f0a64a","#8a5a3b"]):undefined};
}
function babyFur(a,b){
  const body=Math.random()<.55?pick([a.body,b.body]):hex(rgb(mix(a.body,b.body,.5)).map(v=>v+(Math.random()*30-15)));
  const pattern=Math.random()<.8?pick([a.pattern,b.pattern]):pick(PATTERNS);
  const f={body,pattern,eye:Math.random()<.85?pick([a.eye,b.eye]):pick(EYES)};
  if(pattern==="calico") f.spot=a.body!==body?a.body:(b.body!==body?b.body:"#2d2a2e");
  if(f.spot===body) f.spot="#2d2a2e";
  return f;
}
function freeName(){const used=new Set(S?S.cats.map(c=>c.name):[]);const free=NAMES.filter(n=>!used.has(n));return free.length?pick(free):pick(NAMES)+(Math.floor(Math.random()*9)+2);}
function newCat(o){
  return {id:"c"+(S?S.nextId++:0)+"_"+Math.random().toString(36).slice(2,6),name:o.name,sex:o.sex||pick(["m","f"]),
    fur:o.fur,trait:o.trait||pick(Object.keys(TRAITS)),needs:o.needs||{hunger:75,fun:70,clean:80,energy:80,social:60},
    love:o.love||0,born:o.born||Date.now(),adult:!!o.adult,sleeping:false,x:o.x??(20+Math.random()*60),y:Math.random()*50,
    partner:null,preg:null,pregBy:null,parents:o.parents||null};
}

/* ===== drawing ===== */
function catFront(c,{mood="normal",sleep=false}={}){
  const f=fullFur(c.fur), L=f.line;
  const preg=c.preg?10:0;
  let eyes;
  if(sleep) eyes=`<path d="M70 82 q8 6 16 0 M114 82 q8 6 16 0" stroke="#222" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  else if(mood==="happy") eyes=`<path d="M70 84 q8 -9 16 0 M114 84 q8 -9 16 0" stroke="#222" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  else {

/* ===== state ===== */
let S=null, W=null;
function freshState(){return {v:2,cats:[],rel:{},sel:null,poops:[],churu:2,coins:150,deco:starterDeco(),last:Date.now(),nextId:1,savedAt:0};}
function fixState(st){if(!st.book)st.book=[];if(!st.nick)st.nick=((st.cats[0]&&st.cats[0].name)||"냥이")+"네 집";if(st.coins==null)st.coins=150;if(!st.deco)st.deco=starterDeco();st.cats.forEach(c=>{if(c.perch===undefined)c.perch=null;});return st;}
const say$={}; // id -> {t,until}
function load(){try{return JSON.parse(localStorage.getItem(KEY));}catch(e){return null;}}
function save(){if(!S)return;S.savedAt=Date.now();dirty=true;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function migrate(){
  let o=null;try{o=JSON.parse(localStorage.getItem(OLD));}catch(e){}
  if(!o||!o.name) return null;
  const pre={cheese:PRESETS[0],gray:PRESETS[1],black:PRESETS[2],white:PRESETS[3]}[o.fur]||PRESETS[0];
  const st=freshState();st.poops=o.poops||[];
  S=st;
  const c=newCat({name:o.name,sex:"f",fur:{...pre.fur},adult:true,born:o.born,love:o.love||0,
    needs:{hunger:o.hunger,fun:o.fun,clean:o.clean,energy:o.energy,social:60}});
  st.cats.push(c);st.sel=c.id;return st;
}
const byId=id=>S.cats.find(c=>c.id===id);
const sel=()=>byId(S.sel)||S.cats[0];
const rk=(a,b)=>[a.id,b.id].sort().join("|");
const getRel=(a,b)=>S.rel[rk(a,b)]||0;
const addRel=(a,b,d)=>{S.rel[rk(a,b)]=Math.max(-100,Math.min(100,getRel(a,b)+d));};
const isKitten=c=>!c.adult&&Date.now()-c.born<GROW;
const awayIds=()=>W?[W.id,...W.buddies]:[];
function relLabel(a,b){
  if(a.partner===b.id) return "연인 💞";
  if(a.parents&&a.parents.includes(b.id)) return "엄마·아빠";
  if(b.parents&&b.parents.includes(a.id)) return "아기";
  const r=getRel(a,b);
  return r<-20?"앙숙":r<10?"서먹함":r<35?"아는 사이":r<65?"친구":"절친";
}
function mood(c){
  const v=NEEDS.map(n=>c.needs[n.k]);
  if(Math.min(...v)<20) return "sad";
  if(v.reduce((a,b)=>a+b)/v.length>68) return "happy";
  return "normal";
}
const MOODTXT={happy:["행복해요","#3fb27f"],normal:["무난해요","#c79a2c"],sad:["우울해요","#d9534f"]};
function level(c){return Math.floor(c.love/50)+1;}
function ageText(c){
  const m=(Date.now()-c.born)/60000;
  if(isKitten(c)) return `아기 (어른까지 ${Math.max(1,Math.ceil((GROW-(Date.now()-c.born))/60000))}분)`;
  const d=Math.floor(m/1440);return d>=1?`어른 · ${d+1}일째`:"어른";
}

/* ===== log & fx ===== */
let logT;
function log(t){const l=$("logline");l.textContent=t;l.style.opacity=1;clearTimeout(logT);logT=setTimeout(()=>l.style.opacity=0,5000);}
function say(c,t){say$[c.id]={t,until:Date.now()+2600};paintSay(c);}
function paintSay(c){
  const el=document.querySelector(`[data-id="${c.id}"] .say`)||(W&&c.id===W.id?$("walker").querySelector(".say"):null);
  if(!el) return;const s=say$[c.id];
  if(s&&s.until>Date.now()){el.textContent=s.t;el.classList.add("show");}else el.classList.remove("show");
}
function fxAt(ch,el,n=1){
  const st=$("stage"),r=st.getBoundingClientRect(),e=el.getBoundingClientRect();
  for(let i=0;i<n;i++)setTimeout(()=>{const d=document.createElement("div");d.className="fx";d.textContent=ch;
    d.style.left=(e.left-r.left+e.width*(.2+Math.random()*.6))+"px";d.style.top=(e.top-r.top+e.height*(.1+Math.random()*.4))+"px";
    st.appendChild(d);setTimeout(()=>d.remove(),1400);},i*120);
}
const catEl=c=>W&&c.id===W.id?$("walker"):document.querySelector(`[data-id="${c.id}"]`);
function fx(c,ch,n){const el=catEl(c);if(el)fxAt(ch,el,n);}
function bounce(c){const el=catEl(c);if(!el)return;el.classList.remove("bounce");void el.offsetWidth;el.classList.add("bounce");}
function addLove(c,n){const b=level(c);c.love+=n;if(level(c)>b){say(c,`애정 Lv.${level(c)}!`);fx(c,"💖",5);}}

    <div class="bars">${NEEDS.map(n=>{const v=Math.round(c.needs[n.k]);return `<div class="stat"><div class="lab"><span>${n.n}</span><span>${v}</span></div><div class="bar"><i class="${v<20?"low":""}" style="width:${v}%;background:${n.c}"></i></div></div>`;}).join("")}</div>`;

function renderRoom(){
  const box=$("cats"), away=awayIds(), seen=new Set();
  const h=new Date().getHours(), night=h>=19||h<6;
  $("win").innerHTML=night?`<div class="moon"></div>`:"";
  $("win").style.background=night?"#22305a":"";
  renderDecos();renderGuests();
  S.cats.forEach(c=>{
    if(away.includes(c.id)) return;
    seen.add(c.id);
    let el=box.querySelector(`[data-id="${c.id}"]`);
    if(!el){el=document.createElement("div");el.className="cat";el.dataset.id=c.id;el.innerHTML=`<div class="think" hidden></div><div class="say"></div><div class="art"></div>`;el.onclick=()=>tapCat(c.id);box.appendChild(el);}
    const kit=isKitten(c), w=kit?62:96;
    const ps=catPos(c);el.style.width=w+"px";el.style.left=ps.left+"%";el.style.bottom=ps.bottom+"px";el.style.zIndex=ps.z;
    el.classList.toggle("sel",c.id===S.sel);
    const sig=[mood(c),c.sleeping,kit,!!c.preg,JSON.stringify(c.fur)].join();
    if(el.dataset.sig!==sig){el.dataset.sig=sig;el.querySelector(".art").innerHTML=catFront(c,{mood:mood(c),sleep:c.sleeping});}
    const th=el.querySelector(".think");
    const low=NEEDS.filter(n=>c.needs[n.k]<25);
    if(c.sleeping){th.hidden=false;th.textContent="💤";}
    else if(low.length){th.hidden=false;th.textContent=low.map(n=>n.i).slice(0,2).join("");}
    else if(c.preg){th.hidden=false;th.textContent="🍼";}
    else th.hidden=true;
    paintSay(c);
  });
  box.querySelectorAll(".cat").forEach(el=>{if(!seen.has(el.dataset.id))el.remove();});
  // poops
  document.querySelectorAll(".poop").forEach(p=>p.remove());

/* ===== care actions ===== */
function care(kind){
  const c=sel();if(W) return;
  if(c.sleeping&&kind!=="sleep") return;
  const N=c.needs;
  if(kind==="feed"){
    if(N.hunger>95){say(c,"배불러서 못 먹어냥…");return;}
    N.hunger=clamp(N.hunger+30);N.clean=clamp(N.clean-3);addLove(c,N.hunger<60?3:1);
    fx(c,"🐟",3);say(c,pick(["냠냠 맛있다냥!","생선 최고야!","더 줘 냥~"]));
    if(Math.random()<.3&&S.poops.length<4)setTimeout(()=>{if(S.poops.length<4&&!W){S.poops.push(8+Math.random()*80);log(`${ga(c.name)} 실수를 했어요… 똥을 치워 주세요`);save();render();}},7000);
  }
  if(kind==="play"){
    if(N.energy<12){say(c,"너무 졸려서 못 놀겠다냥…");return;}
    N.fun=clamp(N.fun+24);N.energy=clamp(N.energy-10);N.hunger=clamp(N.hunger-5);N.clean=clamp(N.clean-4);N.social=clamp(N.social+5);addLove(c,3);
    fx(c,"🧶",2);bounce(c);say(c,pick(["잡았다냥!","한 번 더!","신난다냥~"]));c.perch=null;c.x=12+Math.random()*76;
  }
  if(kind==="wash"){
    if(N.clean>95){say(c,"이미 반짝반짝하다냥");return;}
    N.clean=clamp(N.clean+38);N.fun=clamp(N.fun-(c.trait==="깔끔쟁이"?0:6));addLove(c,c.trait==="깔끔쟁이"?4:1);
    fx(c,"🫧",6);say(c,c.trait==="깔끔쟁이"?"상쾌하다냥~!":pick(["물은 싫지만 참는다냥","으으 차가워!","보송보송해졌다냥"]));
  }
  if(kind!=="sleep") S.coins+=2;
  if(kind==="sleep"){c.sleeping=!c.sleeping;c.perch=null;say(c,c.sleeping?"잘 자 냥… zZ":"잘 잤다냥! 기지개~");}
  save();render();
}

function selfSheet(c){

function infoSheet(c){

function nameSheet(c,title,sub,after){

/* ===== social ===== */
function socialSheet(a,b){
  const r=getRel(a,b), sleeping=a.sleeping||b.sleeping;
  const bothAdult=!isKitten(a)&&!isKitten(b);
  const family=(a.parents&&a.parents.includes(b.id))||(b.parents&&b.parents.includes(a.id))||(a.parents&&b.parents&&a.parents.some(p=>b.parents.includes(p)));
  const partners=a.partner===b.id;
  let confess="", baby="";
  if(!bothAdult) confess="아기 고양이는 아직 일러요";
  else if(family) confess="가족이에요";
  else if(partners) confess="이미 연인이에요";
  else if(a.partner||b.partner) confess="둘 중 한 마리에게 연인이 있어요";
  else if(r<30) confess=`관계 30 이상 필요 (지금 ${Math.round(r)})`;
  if(!partners) baby="연인이 되어야 해요";
  else if(a.sex===b.sex) baby="수컷과 암컷이어야 해요";
  else if(a.preg||b.preg) baby="이미 아기를 기다리는 중이에요";
  else if(S.cats.length>=MAX) baby=`집이 꽉 찼어요 (최대 ${MAX}마리)`;
  else if(r<45) baby=`관계 45 이상 필요 (지금 ${Math.round(r)})`;
  sheet(`<h2>${a.name} → ${b.name}</h2><div class="sub">지금 관계: ${relLabel(a,b)} (${Math.round(r)}) · ${b.trait}</div>
    ${sleeping?`<div class="sub" style="margin:0">${ga(a.sleeping?a.name:b.name)} 자고 있어서 교류할 수 없어요.</div>`:""}
    <div class="acts">
      ${act("hi","인사하기","코 인사 킁킁",!sleeping)}
      ${act("groom","그루밍 해주기","친할수록 성공해요",!sleeping)}
      ${act("play","같이 뛰어놀기","즐거움 +, 기운 −",!sleeping&&a.needs.energy>10&&b.needs.energy>10)}
      ${act("tease","꼬리 장난치기","운에 따라 좋거나 나빠요",!sleeping)}
      ${act("confess","고백하기 💌",confess||"연인이 될 수 있을까?",!sleeping&&!confess,"love")}
      ${act("baby","아기 갖기 🍼",baby||"새 식구가 생길지도!",!sleeping&&!baby,"love")}
      ${partners?act("break","헤어지기","관계가 크게 나빠져요",!sleeping):""}
      ${act("select",`${eul(b.name)} 선택`,"이 고양이를 돌보기",true)}
    </div><button class="btn" data-close>닫기</button>`,root=>{
    root.querySelectorAll("[data-a]").forEach(btn=>btn.onclick=()=>{closeSheet();
      if(btn.dataset.a==="select"){S.sel=b.id;render();return;}
      social(a,b,btn.dataset.a);});
  });
}
function social(a,b,type,auto=false){
  const r=getRel(a,b);
  const charm=(a.trait==="애교쟁이"?.15:0)-(b.trait==="새침데기"?.15:0);
  const soc=(x,v)=>x.needs.social=clamp(x.needs.social+v);
  a.perch=null;b.perch=null;b.x=Math.max(6,Math.min(94,a.x+(a.x<50?14:-14)));
  let msg="";
  if(type==="hi"){addRel(a,b,4+charm*10);soc(a,10);soc(b,8);say(a,"안녕 냥!");setTimeout(()=>say(b,"냥~"),700);msg=`${ga(a.name)} ${b.name}에게 코 인사를 했어요`;}
  if(type==="groom"){
    if(Math.random()<.5+r/200+charm){addRel(a,b,9);soc(a,12);soc(b,12);b.needs.clean=clamp(b.needs.clean+8);fx(b,"💕",2);say(a,"핥핥");setTimeout(()=>say(b,"골골골…"),700);msg=`${ga(a.name)} ${eul(b.name)} 그루밍해 줬어요`;}
    else{addRel(a,b,-6);soc(a,4);say(a,"가만있어 봐!");setTimeout(()=>say(b,"하악!"),600);fx(b,"💢",1);msg=`${neun(b.name)} 그루밍이 싫었나 봐요`;}
  }
  if(type==="play"){addRel(a,b,8+charm*10);[a,b].forEach(x=>{x.needs.fun=clamp(x.needs.fun+16);x.needs.energy=clamp(x.needs.energy-8);soc(x,12);});
    bounce(a);setTimeout(()=>bounce(b),250);fx(a,"🎾",1);say(a,"잡아 봐라냥!");msg=`${wa(a.name)} ${ga(b.name)} 신나게 뛰어놀았어요`;}
  if(type==="tease"){
    if(Math.random()<.55+charm){addRel(a,b,6);[a,b].forEach(x=>x.needs.fun=clamp(x.needs.fun+10));say(b,"냥하하!");fx(b,"😹",1);msg=`${neun(b.name)} 장난을 재밌어했어요`;}
    else{addRel(a,b,-9);b.needs.fun=clamp(b.needs.fun-6);say(b,"뭐 하는 거냥!");fx(b,"💢",2);msg=`${ga(b.name)} 화가 났어요`;}
  }
  if(type==="confess"){
    say(a,"나… 너 좋아한다냥");
    const ok=Math.random()<.6+(r-30)/60+charm;
    setTimeout(()=>{
      if(ok){a.partner=b.id;b.partner=a.id;addRel(a,b,15);say(b,"나도 좋아냥 💕");fx(a,"💞",4);fx(b,"💖",4);log(`💞 ${wa(a.name)} ${ga(b.name)} 연인이 되었어요!`);}
      else{addRel(a,b,-12);a.needs.social=clamp(a.needs.social-15);say(b,"우린 친구로 지내자냥…");fx(a,"💔",2);log(`${neun(b.name)} 아직 마음이 없나 봐요…`);}
      save();render();
    },1200);
  }
  if(type==="baby"){
    say(a,"우리 아기 갖자냥 🍼");
    setTimeout(()=>{
      if(Math.random()<.92){const mom=a.sex==="f"?a:b,dad=mom===a?b:a;mom.preg=Date.now()+PREG;mom.pregBy=dad.id;addRel(a,b,8);
        fx(mom,"🍼",3);say(b,"좋아냥!");log(`🤰 ${ga(mom.name)} 아기를 가졌어요! 15초 뒤에 태어나요`);}
      else{say(b,"아직은 때가 아닌 것 같다냥");log("이번엔 소식이 없어요. 조금 뒤에 다시 해 보세요");}
      save();render();
    },1200);
  }
  if(type==="break"){a.partner=null;b.partner=null;addRel(a,b,-35);say(a,"우리 그만하자냥…");setTimeout(()=>{say(b,"흑…");fx(b,"💔",2);},700);msg=`💔 ${wa(a.name)} ${ga(b.name)} 헤어졌어요`;}
  if(msg) log(msg);
  if(!auto){S.coins+=1;save();render();}
}

/* ===== birth & growth ===== */
function birth(mom){
  const dad=byId(mom.pregBy)||mom;
  mom.preg=null;mom.pregBy=null;
  const room=MAX-S.cats.length;
  if(room<=0){log("집이 꽉 차서 아기가 이웃집으로 입양 갔어요");return;}
  const n=Math.min(room,1+(Math.random()<.55?1:0)+(Math.random()<.25?1:0));
  const kids=[];
  for(let i=0;i<n;i++){
    const k=newCat({name:freeName(),fur:babyFur(mom.fur,dad.fur),trait:Math.random()<.5?pick([mom.trait,dad.trait]):undefined,
      parents:[mom.id,dad.id],x:Math.min(92,mom.x+8+i*8),needs:{hunger:80,fun:80,clean:90,energy:90,social:70}});
    S.cats.push(k);addRel(k,mom,60);addRel(k,dad,50);
    S.cats.forEach(o=>{if(o!==k&&o!==mom&&o!==dad)addRel(k,o,kids.includes(o)?40:10);});
    kids.push(k);
  }
  mom.perch=null;
  log(`🐣 ${wa(mom.name)} ${dad.name}의 아기 ${n}마리가 태어났어요!`);
  save();render();
  if(W) return;
  const nameNext=i=>{if(i>=kids.length)return;const k=kids[i];
    nameSheet(k,n>1?`아기 ${i+1}/${n}마리째 이름 짓기`:"아기 고양이가 태어났어요!",`${mom.name} ♀ × ${dad.name} ♂ · ${k.sex==="m"?"♂ 수컷":"♀ 암컷"} · ${PAT_NAME[k.fur.pattern]} · ${k.trait}`,()=>nameNext(i+1));};
  nameNext(0);
}

/* ===== walk ===== */
const FAR=["🏠","🌳","🏪","🏡","🌲","🏫","🏘️","🌳","⛪","🏡"];
const NEAR=["🌷","🪨","🌿","🌼","🚏","🌳","🌱","🍄","🪵","🌻"];
function buildLayer(el,arr){const s=arr.map(x=>`<span>${x}</span>`).join("");el.innerHTML=s+s;el._w=0;}
function startWalk(){
  const c=sel();
  if(c.sleeping) return;
  if(c.needs.energy<20){say(c,"너무 피곤해서 못 나가겠다냥…");return;}
  if(V)return;
  c.perch=null;if(DM.on)setDecoMode(false);
  W={id:c.id,dist:0,off:0,next:Date.now()+3500,paused:false,buddies:[],t:performance.now()};
  $("room").hidden=true;$("walk").hidden=false;
  buildLayer($("far"),FAR);buildLayer($("near"),NEAR);
  $("npcs").innerHTML="";
  const wk=$("walker");wk.className="walker moving";wk.style.left="42%";wk.innerHTML=`<div class="say"></div>${catSide(c)}`;
  log(`${ga(c.name)} 산책을 나왔어요`);
  say(c,pick(["산책이다냥!","바깥 공기 좋다냥~","출발!"]));
  render();requestAnimationFrame(walkFrame);
}
function walkFrame(t){
  if(!W) return;
  const dt=Math.min(.05,(t-W.t)/1000);W.t=t;
  if(!W.paused){W.off+=dt*70;W.dist+=dt*1.4;}
  [["far",.35],["near",1]].forEach(([id,sp])=>{const el=$(id);if(!el._w)el._w=el.scrollWidth/2;if(el._w)el.style.transform=`translateX(${-((W.off*sp)%el._w)}px)`;});
  $("dist").textContent=Math.floor(W.dist)+"m";
  requestAnimationFrame(walkFrame);
}
function setMoving(on){W.paused=!on;$("walker").classList.toggle("moving",on);document.querySelectorAll(".npc.buddy").forEach(n=>n.classList.toggle("moving",on));}
function ecard(title,text,buttons){
  const d=document.createElement("div");d.className="ecard";d.id="ecard";
  d.innerHTML=`<h3>${title}</h3><p>${text}</p><div class="row">${buttons.map((b,i)=>`<button class="btn ${b.pri?"pri":""}" data-i="${i}" ${b.dis?"disabled":""}>${b.t}</button>`).join("")}</div>`;
  $("walk").appendChild(d);
  d.querySelectorAll("button").forEach(btn=>btn.onclick=()=>{d.remove();buttons[+btn.dataset.i].f();save();render();});
}
function npc(html,cls=""){const n=document.createElement("div");n.className="npc "+cls;n.style.left="115%";n.innerHTML=html;$("npcs").appendChild(n);requestAnimationFrame(()=>requestAnimationFrame(()=>n.style.left="70%"));return n;}
function leave(n){n.style.transition="left 2s linear";n.style.left="130%";setTimeout(()=>n.remove(),2100);}
function resume(){setMoving(true);W.next=Date.now()+4000+Math.random()*4000;}
function walkEvent(){
  const c=byId(W.id);
  const roll=Math.random();
  setMoving(false);
  if(roll<.4){ // stray
    const s=newCat({name:freeName(),fur:randomFur(),adult:true,needs:{hunger:30,fun:45,clean:35,energy:60,social:40}});
    const n=npc(`<div class="say"></div>${catSide(s)}`,"flip moving");
    setTimeout(()=>{n.classList.remove("moving");
      const full=S.cats.length>=MAX;
      ecard("길고양이를 만났어요!",`${s.sex==="m"?"♂":"♀"} ${PAT_NAME[s.fur.pattern]} 무늬, 성격은 ${s.trait}. 배가 고파 보여요.${full?` 집이 꽉 찼어요 (최대 ${MAX}마리).`:""}`,[
        {t:"냥줍하기 🏠",pri:true,dis:full,f:()=>{S.cats.push(s);W.buddies.push(s.id);addRel(c,s,15);addLove(s,5);
          n.classList.remove("flip");n.classList.add("buddy","moving");n.style.transition="left 1.4s ease-out";n.style.left="20%";
          fx(c,"💕",2);log(`🏠 ${neun(s.name)} 이제 우리 식구예요! (이름은 집에서 바꿀 수 있어요)`);resume();}},
        {t:"츄르만 주기",dis:!S.churu,f:()=>{S.churu--;addLove(c,2);c.needs.social=clamp(c.needs.social+10);log(`${s.name}에게 츄르를 줬어요. 고맙다고 하네요`);leave(n);resume();}},
        {t:"지나가기",f:()=>{leave(n);resume();}},
      ]);
    },1700);
  } else if(roll<.5){
    const g=10+Math.floor(Math.random()*16);S.coins+=g;W.coin=(W.coin||0)+g;fx(c,"🪙",3);say(c,"반짝이는 게 있다냥!");
    ecard("동전 주머니를 주웠어요",`🪙 +${g} 코인. 캣타워 꾸미기에 쓸 수 있어요`,[{t:"챙기기",pri:true,f:resume}]);
  } else if(roll<.6){
    S.churu++;fx(c,"🍬",2);say(c,"이게 뭐다냥?");
    ecard("길에서 츄르를 주웠어요","아무도 안 뜯은 새 거예요. 츄르 +1",[{t:"챙기기",pri:true,f:resume}]);
  } else if(roll<.72){
    fx(c,"🦋",3);say(c,"나비다냥!!");c.needs.fun=clamp(c.needs.fun+15);c.needs.energy=clamp(c.needs.energy-4);
    ecard("나비를 쫓아다녔어요","즐거움 +15",[{t:"계속 걷기",pri:true,f:resume}]);
  } else if(roll<.84){
    const n=npc(`<div style="font-size:64px;line-height:1;transform:scaleX(-1)">🐕</div>`);
    setTimeout(()=>ecard("이웃집 강아지가 다가와요","꼬리를 흔들고 있어요. 어떻게 할까요?",[
      {t:"인사하기",pri:true,f:()=>{if(Math.random()<.55){c.needs.social=clamp(c.needs.social+15);say(c,"멍멍이 친구다냥");log("강아지와 친구가 되었어요");}
        else{c.needs.fun=clamp(c.needs.fun-8);say(c,"하악! 무섭다냥");fx(c,"💦",2);log("강아지가 너무 반가워해서 깜짝 놀랐어요");}leave(n);resume();}},
      {t:"도망가기",f:()=>{c.needs.energy=clamp(c.needs.energy-6);say(c,"후다닥!");leave(n);resume();}},
    ]),1300);
  } else if(roll<.93){
    c.needs.clean=clamp(c.needs.clean-15);fx(c,"💧",3);say(c,"으앗 첨벙!");
    ecard("웅덩이를 밟았어요","발이 젖었어요. 청결 −15",[{t:"털고 가기",pri:true,f:resume}]);
  } else {
    c.needs.hunger=clamp(c.needs.hunger+20);c.needs.social=clamp(c.needs.social+12);fx(c,"🐟",2);say(c,"할머니 최고다냥");
    ecard("동네 할머니를 만났어요","간식을 나눠 주셨어요. 배부름 +20, 사교 +12",[{t:"고맙다냥",pri:true,f:resume}]);
  }
}
function endWalk(){
  if(!W) return;
  const c=byId(W.id),d=Math.floor(W.dist),n=W.buddies.length,coin=Math.floor(d/4)+(W.coin||0);S.coins+=Math.floor(d/4);
  W=null;$("walk").hidden=true;$("room").hidden=false;$("ecard")?.remove();
  c.x=50;
  log(`🏠 ${ga(c.name)} ${d}m 산책하고 돌아왔어요 · 🪙 +${coin}${n?` · 새 식구 ${n}마리!`:""}`);
  render();save();
}
$("bHome").onclick=endWalk;
$("bChuruW").onclick=()=>{if(W)useChuru(byId(W.id));};

/* ===== P2P network: Trystero (MIT) over public Nostr relays — no server needed ===== */
const NET_APP="nyang-kiugi-town-public-v1";
function trRoom(name){
  let r=null;try{r=Trystero.joinRoom({appId:NET_APP},name);}catch(e){return null;}
  const pr=r.makeAction("pr"),ev=r.makeAction("ev");
  let mine={},peers={},hs=[],ons={},sendT=null;
  const meP=()=>({peer:Trystero.selfId,by:null,isMe:true,sameTab:true,kind:"viewer",guest:false,presence:mine,updatedAt:Date.now()});
  const list=()=>[meP(),...Object.values(peers)];
  const fire=(j,l,u)=>{const ch={peers:list(),joined:j||[],left:l||[],updated:u||[]};hs.forEach(h=>{try{h(ch);}catch(e){}});};
  r.onPeerJoin=id=>{pr.send(mine,{target:id}).catch(()=>{});};
  r.onPeerLeave=id=>{const p=peers[id];delete peers[id];if(p)fire([],[p]);};
  pr.onMessage=(d,ctx)=>{const id=ctx&&ctx.peerId;if(!id||!d||typeof d!=="object"||Array.isArray(d))return;
    const was=peers[id];const p=Object.freeze({peer:id,by:null,isMe:false,sameTab:false,kind:"viewer",guest:false,presence:d,updatedAt:Date.now()});
    peers[id]=p;was?fire([],[],[p]):fire([p]);};
  ev.onMessage=(m,ctx)=>{if(!m||typeof m.t!=="string")return;(ons[m.t]||[]).forEach(f=>{try{f({topic:m.t,data:m.d,peer:ctx&&ctx.peerId,isMe:false});}catch(e){}});};
  return {name,
    presence(patch){for(const k in patch){if(patch[k]===null)delete mine[k];else mine[k]=patch[k];}
      clearTimeout(sendT);sendT=setTimeout(()=>pr.send(mine).catch(()=>{}),120);return Promise.resolve();},
    peers:list,
    onPeers(h){hs.push(h);setTimeout(()=>{try{h({peers:list(),joined:list(),left:[],updated:[]});}catch(e){}},0);return()=>{hs=hs.filter(x=>x!==h);};},
    emit(topic,data,opt){return ev.send({t:topic,d:data},opt&&opt.target?{target:opt.target}:undefined).catch(()=>{});},
    on(topic,fn){(ons[topic]=ons[topic]||[]).push(fn);return()=>{ons[topic]=ons[topic].filter(x=>x!==fn);};},
    join(n){const x=trRoom(n);return x?Promise.resolve(x):Promise.reject(new Error("join"));},
    leave(){try{return r.leave();}catch(e){return Promise.resolve();}}};
}

    const sig=JSON.stringify(p.cat);if(el.dataset.sig!==sig){el.dataset.sig=sig;el.querySelector(".art").innerHTML=catFront(p.cat,{mood:"happy"});}
    el.style.width=(p.cat.adult?88:60)+"px";el.style.left=p.x+"%";el.style.bottom=(22+(i%3)*10)+"px";el.style.zIndex=160+i;
    el.querySelector(".tag").textContent=p.me?`나 · ${p.cat.name}`:`${p.nick} · ${p.cat.name}`;
    const t=bubbleFor(p.key,p.say,p.sayAt,p.me?Date.now():p.upd),sy=el.querySelector(".say");
    if(t){sy.textContent=t;sy.classList.add("show");}else sy.classList.remove("show");
    if(p.emote&&String(p.emoteAt)!==el.dataset.em){const fresh=el.dataset.em!==undefined||(Date.now()-(p.me?Date.now():p.upd)<4000);el.dataset.em=String(p.emoteAt);if(fresh)fxAt(p.emote,el,3);}
  });
  box.querySelectorAll(".remote").forEach(el=>{if(!seen.has(el.dataset.k))el.remove();});
}
function onHomePeers(ch){
  T.guests=ch.peers.filter(p=>!p.isMe).map(peerRemote).filter(Boolean);
  ch.joined.forEach(p=>{const r=peerRemote(p);if(r&&!p.isMe){log(`🔔 ${r.nick}님이 ${eul(r.cat.name)} 데리고 놀러왔어요!`);T.home&&T.home.emit("book",(S.book||[]).slice(0,20),{target:p.peer});}});
  ch.left.forEach(p=>{const r=peerRemote(p);if(r&&!p.isMe)log(`${r.nick}님이 집으로 돌아갔어요`);});
  ch.updated.forEach(p=>{const r=peerRemote(p);if(r&&r.say&&!p.isMe&&bub[p.peer]?.k!==r.say+"|"+r.sayAt)log(`💬 ${r.nick}: ${r.say}`);});
  if(!V&&!W) renderGuests();
}
function renderGuests(){
  if(V||W){$("guests").innerHTML="";$("hostchat").hidden=true;return;}
  renderRemote($("guests"),T.guests);$("hostchat").hidden=!T.guests.length;
}
function hostSay(){
  const t=clip($("hSay").value,40);if(!t)return;$("hSay").value="";
  T.say=t;T.sayAt=Date.now();say(sel(),t);homePresence();
}
$("hSayBtn").onclick=hostSay;$("hSay").onkeydown=e=>{if(e.key==="Enter")hostSay();};

/* visiting */
function visitPresence(){
  if(!V||!V.room) return;
  V.room.presence({role:"guest",nick:nickOf(),cat:liteCat(sel()),x:V.me.x,say:V.me.say||null,sayAt:V.me.sayAt||0,emote:V.me.emote||null,emoteAt:V.me.emoteAt||0}).catch(()=>{});
}
async function visit(uid){
  drawTown();const h=T.houses.find(x=>x.uid===uid);if(!h||uid===T.uid) return;
  closeSheet();if(W)endWalk();if(DM.on)setDecoMode(false);
  const cats=(Array.isArray(h.cats)?h.cats:[]).slice(0,MAX).map(c=>({...cleanCat(c),x:10+Math.random()*80,y:Math.random()*40,perch:null}));
  V={uid,nick:clip(h.nick,12)||"이름 없는 집",room:null,peers:[],cats,deco:(Array.isArray(h.deco)?h.deco:[]).map(cleanDeco).filter(Boolean).slice(0,40),me:{x:50}};
  sel().perch=null;
  $("room").hidden=true;$("visit").hidden=false;$("vtitle").textContent=`🏠 ${V.nick}`;
  $("vdecos").innerHTML=V.deco.map(d=>{const D=DECO[d.t];return `<div class="deco ${d.f?"flip":""}" style="width:${D.w}px;height:${D.h}px;left:${d.x}%;bottom:${d.y}px;z-index:${D.flat?1:30+Math.round(d.y/10)}">${decoSVG(d.t)}</div>`;}).join("");
  $("vcats").innerHTML="";
  V.cats.forEach(c=>{const el=document.createElement("div");el.className="cat";el.dataset.vid=c.id;
    el.innerHTML=`<div class="say"></div><div class="art">${catFront(c,{mood:"happy"})}</div><div class="tag"></div>`;
    el.querySelector(".tag").textContent=c.name;el.onclick=e=>{e.stopPropagation();petGuestCat(c,el);};$("vcats").appendChild(el);});
  S.visits=S.visits||{};S.visits[uid]=(S.visits[uid]||0)+1;
  log(`🚪 ${V.nick}에 ${wa(sel().name)} 함께 놀러왔어요!`);
  lobbyPresence();homePresence();render();
  if(T.lobby){
    const mine=V;
    try{const r=await T.lobby.join(hname(uid));if(V!==mine){r.leave();return;}V.room=r;
      r.onPeers(ch=>{if(V!==mine)return;V.peers=ch.peers;
        ch.joined.forEach(p=>{const pr=p.presence||{};if(!p.isMe&&pr.role==="host")log(`집주인 ${clip(pr.nick,12)}님이 집에 있어요! 인사해 보세요`);});},()=>{});
      r.on("book",m=>{if(V!==mine||!Array.isArray(m.data))return;V.book=m.data.slice(0,20).map(n=>({id:clip(n&&n.id,20),nick:clip(n&&n.nick,12),cat:clip(n&&n.cat,8),text:clip(n&&n.text,80),at:+(n&&n.at)||0}));if($("bookList")&&window._drawBook)window._drawBook();});
      visitPresence();}catch(e){log("지금은 실시간 연결이 어려워요. 잠시 뒤에 다시 놀러 와 주세요");}
  }
}
function petGuestCat(c,el){
  const me=sel();me.needs.social=clamp(me.needs.social+6);me.needs.fun=clamp(me.needs.fun+3);
  fxAt("❤️",el,2);const sy=el.querySelector(".say");sy.textContent=pick(["골골골…","누구냥?","반갑다냥!","놀러 왔구나냥","간식 있냥?"]);sy.classList.add("show");
  clearTimeout(el._t);el._t=setTimeout(()=>sy.classList.remove("show"),2500);
}
$("visit").onclick=e=>{if(!V)return;const r=$("stage").getBoundingClientRect();V.me.x=Math.max(6,Math.min(94,(e.clientX-r.left)/r.width*100));visitPresence();renderVisit();};
function visitTick(){
  if(!V) return;
  const perches=V.deco.filter(d=>DECO[d.t].perch!=null);
  V.cats.forEach(c=>{
    if(Math.random()<.05){
      if(c.perch){const d=V.deco.find(x=>x.id===c.perch);c.perch=null;if(d)c.x=d.x;}
      else{const free=perches.filter(d=>!V.cats.some(o=>o.perch===d.id));if(free.length&&Math.random()<.5){const d=pick(free);c.perch=d.id;c.x=d.x;}}
    }
    if(!c.perch&&Math.random()<.12){c.x=Math.max(6,Math.min(94,c.x+(Math.random()*40-20)));}
  });
}
function renderVisit(){
  if(!V) return;
  const hostP=V.peers.find(p=>!p.isMe&&(p.presence||{}).role==="host");
  const hp=hostP?hostP.presence:{};
  V.cats.forEach(c=>{
    const el=$("vcats").querySelector(`[data-vid="${CSS.escape(c.id)}"]`);if(!el)return;
    const d=c.perch&&V.deco.find(x=>x.id===c.perch);
    el.style.width=(c.adult?92:62)+"px";el.style.left=(d?d.x:c.x)+"%";el.style.bottom=(d?d.y+DECO[d.t].perch-6:8+c.y)+"px";el.style.zIndex=d?300:100-Math.round(c.y);
    if(hostP&&hp.selId===c.id&&!hp.away){const t=bubbleFor("host",clip(hp.say,40),+hp.sayAt||0,hostP.updatedAt);const sy=el.querySelector(".say");
      if(t){sy.textContent=t;sy.classList.add("show");}}
    el.querySelector(".tag").textContent=(hostP&&hp.selId===c.id&&!hp.away?"👑 ":"")+c.name;
  });
  const list=V.peers.filter(p=>!(p.isMe&&p.sameTab)).map(peerRemote).filter(Boolean);
  list.unshift({key:"me",cat:liteCat(sel()),nick:nickOf(),x:V.me.x,say:V.me.say,sayAt:V.me.sayAt||0,emote:V.me.emote,emoteAt:V.me.emoteAt||0,upd:Date.now(),me:true});
  renderRemote($("vcats"),list);
}
function vSay(){const t=clip($("vSay").value,40);if(!t||!V)return;$("vSay").value="";V.me.say=t;V.me.sayAt=Date.now();visitPresence();renderVisit();}
$("vSayBtn").onclick=vSay;$("vSay").onkeydown=e=>{if(e.key==="Enter")vSay();};
document.querySelectorAll("[data-emo]").forEach(b=>b.onclick=()=>{if(!V)return;V.me.emote=b.dataset.emo;V.me.emoteAt=Date.now();visitPresence();renderVisit();});
function leaveVisit(){
  if(!V) return;const n=V.nick;
  if(V.room)V.room.leave().catch(()=>{});
  V=null;$("visit").hidden=true;$("room").hidden=false;$("vcats").innerHTML="";
  log(`🏠 ${n}에서 집으로 돌아왔어요`);lobbyPresence();homePresence();save();render();
}
$("vHome").onclick=leaveVisit;
$("vBook").onclick=()=>{if(V)bookSheet(V.uid,V.nick);};

/* guestbook — kept by each host on their own device; visitors can sign while the host is online */
function bookSheet(uid,nick){
  const mine=uid===T.uid;
  const notes=()=>mine?(S.book||[]):((V&&V.book)||[]);
  const hostOn=()=>!!(V&&V.peers.some(p=>!p.isMe&&(p.presence||{}).role==="host"));
  const draw=()=>{const box=$("bookList");if(!box)return;const ns=notes();
    box.innerHTML=ns.length?ns.map(n=>`<div class="note"><span>${esc(clip(n.text,80))}</span><small><span>${esc(clip(n.nick,12)||"손님")}${n.cat?` · ${esc(clip(n.cat,8))}`:""} · ${hm(+n.at)}</span>${mine?`<button data-del="${esc(n.id)}">지우기</button>`:""}</small></div>`).join("")
      :`<div class="notice">${mine||hostOn()?"아직 방명록이 비어 있어요.":"집주인이 접속해 있을 때 방명록을 보고 남길 수 있어요."}</div>`;
    box.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{S.book=(S.book||[]).filter(n=>n.id!==b.dataset.del);save();T.home&&T.home.emit("book",S.book.slice(0,20));draw();});
  };
  window._drawBook=draw;
  sheet(`<h2>📝 ${esc(nick)} 방명록</h2>
    ${mine?"":`<div class="chatrow"><input id="bookIn" class="txt" maxlength="80" placeholder="한마디 남기기" autocomplete="off"><button class="btn pri" id="bookBtn">남기기</button></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" data-q="🐾 발도장 꾹!">🐾 발도장</button><button class="btn" data-q="고양이들 너무 귀여워요 💕">💕 귀여워요</button><button class="btn" data-q="캣타워 멋져요! 🏗️">🏗️ 캣타워 칭찬</button></div>`}
    <div class="hlist" id="bookList"></div><div class="sub" id="bookMsg" style="margin:0"></div>
    <button class="btn" data-close>닫기</button>`,root=>{
    if(!mine){
      const write=t=>{t=clip(t,80);if(!t||!V||!V.room)return;
        if(!hostOn()){$("bookMsg").textContent="집주인이 지금 접속해 있지 않아요. 집주인이 있을 때 다시 남겨 주세요";return;}
        V.room.emit("note",{nick:nickOf(),cat:sel().name,text:t});
        V.book=[{id:"me"+Date.now(),nick:nickOf(),cat:sel().name,text:t,at:Date.now()},...(V.book||[])].slice(0,20);
        $("bookIn")&&($("bookIn").value="");S.coins+=3;$("bookMsg").textContent="방명록을 남겼어요 (🪙 +3)";draw();};
      $("bookBtn").onclick=()=>write($("bookIn").value);
      $("bookIn").onkeydown=e=>{if(e.key==="Enter")write($("bookIn").value);};
      root.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>write(b.dataset.q));
    }
    draw();
  });
}

/* town sheet */
function townSheet(){
  if(!T.lobby){
    sheet(`<h2>🏘️ 냥이 마을</h2><div class="notice">마을에 연결하지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</div><button class="btn" data-close>닫기</button>`);return;
  }
  sheet(`<h2>🏘️ 냥이 마을</h2>
    <div><label class="sub" for="nickIn" style="display:block;margin:0 0 4px">우리 집 이름</label>
    <div class="chatrow"><input id="nickIn" class="txt" maxlength="12" value="${esc(nickOf())}" autocomplete="off"><button class="btn" id="nickBtn">바꾸기</button></div></div>
    <div class="notice">지금 접속해 있는 집에만 놀러 갈 수 있어요. 모르는 사람에게 이름·학교·연락처 같은 개인정보는 알려주지 마세요.</div>

    $("myBook").onclick=()=>bookSheet(T.uid,nickOf());

function drawTown(){
  const peers=T.lobby?T.lobby.peers():[];
  const seen=new Set();T.houses=[];
  peers.forEach(p=>{const pr=p.presence||{};if(p.isMe||!HID.test(pr.hid||"")||pr.hid===T.uid||seen.has(pr.hid))return;seen.add(pr.hid);
    T.houses.push({uid:pr.hid,nick:pr.nick,cats:pr.cats,deco:pr.deco,count:pr.count,updatedAt:p.updatedAt,where:pr.at,visit:pr.visit});});
  const box=$("townList");if(!box) return;
  const visitors=uid=>peers.filter(p=>(p.presence||{}).visit===uid).length;
  box.innerHTML=T.houses.length?T.houses.map(h=>{
    const cats=(Array.isArray(h.cats)?h.cats:[]).slice(0,3).map(cleanCat);
    const v=visitors(h.uid);
    return `<div class="hcard"><div class="faces">${cats.map(c=>catFront(c,{mood:"happy"})).join("")}</div>
      <div style="min-width:0"><div class="hn">${esc(clip(h.nick,12)||"이름 없는 집")}</div>
      <div class="hm"><span class="dot"></span>${h.where==="visit"?"놀러 나감":"집에 있음"} · 🐱 ${Math.min(99,+h.count||cats.length)}${v?` · 손님 ${v}명`:""}${S.visits&&S.visits[h.uid]?` · 방문 ${S.visits[h.uid]}회`:""}</div></div>
      <button class="btn pri" data-visit="${esc(h.uid)}" style="flex:none">놀러가기</button></div>`;}).join("")
    :`<div class="notice">지금은 접속한 이웃이 없어요. 친구에게 이 사이트 주소를 보내 같이 접속해 보세요. 연결되는 데 10~20초쯤 걸릴 수 있어요.</div>`;
  box.querySelectorAll("[data-visit]").forEach(b=>b.onclick=()=>visit(b.dataset.visit));
}
function refreshTown(){drawTown();updateOnline();}
$("townBtn").onclick=townSheet;

/* ===== loop ===== */
let tickN=0;
function tickCat(c,dt,k){
  const m=TRAITS[c.trait].m;
  NEEDS.forEach(n=>{
    if(c.sleeping&&n.k==="energy") c.needs.energy=clamp(c.needs.energy+.6*dt*k);
    else c.needs[n.k]=clamp(c.needs[n.k]-n.r*(m[n.k]||1)*dt*k*(c.sleeping?.4:1)*(isKitten(c)?1.15:1));
  });
  if(S.poops.length) c.needs.clean=clamp(c.needs.clean-.02*dt*S.poops.length*k);
}
function loop(){
  const now=Date.now(),dt=Math.min(5,(now-S.last)/1000);S.last=now;tickN++;
  S.cats.forEach(c=>{
    tickCat(c,dt,1);
    if(W&&c.id===W.id&&!W.paused){c.needs.energy=clamp(c.needs.energy-.3*dt);c.needs.fun=clamp(c.needs.fun+.5*dt);c.needs.social=clamp(c.needs.social+.15*dt);}
    if(!c.adult&&now-c.born>=GROW){c.adult=true;log(`🎉 ${ga(c.name)} 어른 고양이가 되었어요!`);}
    if(c.preg&&now>=c.preg) birth(c);
    if(!W||!awayIds().includes(c.id)){
      if(!c.sleeping&&c.needs.energy<6){c.sleeping=true;say(c,"졸려서 쓰러졌다냥…");}
      if(c.sleeping&&c.needs.energy>=100){c.sleeping=false;say(c,"푹 잤다냥!");}
      const pd=c.perch&&decoById(c.perch);
      if(pd){const T=DECO[pd.t];if(T.run&&!c.sleeping){c.needs.fun=clamp(c.needs.fun+.4*dt);c.needs.energy=clamp(c.needs.energy-.15*dt);}
        else if(T.cozy&&c.sleeping)c.needs.energy=clamp(c.needs.energy+.35*dt);else if(!c.sleeping)c.needs.fun=clamp(c.needs.fun+.08*dt);}
      if(!W&&!c.sleeping&&Math.random()<.05){
        if(c.perch){const d=decoById(c.perch);c.perch=null;if(d)c.x=d.x;}
        else{const f=freePerches();if(f.length){const d=pick(f);c.perch=d.id;c.x=d.x;if(Math.random()<.4)say(c,DECO[d.t].run?"달려라냥!":pick(["점프!","높은 곳 최고냥","여기 내 자리다냥"]));}}
      }
      if(!W&&c.sleeping&&!c.perch&&Math.random()<.08){const f=freePerches(true);if(f.length){const d=pick(f);c.perch=d.id;c.x=d.x;}}
      if(!c.perch&&!c.sleeping&&!W&&Math.random()<.12){c.x=Math.max(6,Math.min(94,c.x+(Math.random()*40-20)));c.y=Math.max(0,Math.min(50,c.y+(Math.random()*20-10)));}
      if(!c.sleeping&&!W&&mood(c)!=="sad"&&NEEDS.every(n=>c.needs[n.k]>55)) c.love+=.01*dt;
    }
  });
  // autonomous socializing at home
  if(!W&&tickN%9===0){
    const awake=S.cats.filter(c=>!c.sleeping);
    if(awake.length>=2){
      const a=pick(awake),b=pick(awake.filter(x=>x!==a));
      const r=getRel(a,b);
      social(a,b,r>30&&Math.random()<.5?"play":r<-20?"tease":"hi",true);
    }
  }
  if(W&&!W.paused&&Date.now()>=W.next&&!$("ecard")) walkEvent();
  if(W&&!W.paused){const c=byId(W.id);if(c.needs.energy<10){setMoving(false);say(c,"다리 아프다냥…");ecard("지쳐 버렸어요","기운이 바닥났어요. 집에 가서 쉬어요.",[{t:"집으로",pri:true,f:endWalk}]);}}
  if(tickN%5===0) save();
  if(tickN%30===0){cloudSave();publishHouse();}
  if(V)visitTick();
  homePresence();
  render();
}

/* ===== setup ===== */
let preIdx=0, sexSel="f";
function showSetup(){
  $("setup").hidden=false;$("game").hidden=true;$("chips").innerHTML="";
  $("furs").innerHTML=PRESETS.map((p,i)=>`<button class="pick ${i===preIdx?"sel":""}" data-p="${i}">${catFront({fur:p.fur},{})}${p.name}</button>`).join("");
  $("furs").querySelectorAll(".pick").forEach(b=>b.onclick=()=>{preIdx=+b.dataset.p;$("nameIn").value=PRESETS[preIdx].name;showSetup();});
  $("sexes").innerHTML=[["f","♀ 암컷"],["m","♂ 수컷"]].map(([k,t])=>`<button class="pick ${sexSel===k?"sel":""}" data-s="${k}">${t}</button>`).join("");
  $("sexes").querySelectorAll(".pick").forEach(b=>b.onclick=()=>{sexSel=b.dataset.s;showSetup();});
}
$("goBtn").onclick=()=>{
  S=freshState();
  const c=newCat({name:($("nameIn").value.trim()||"냥이").slice(0,8),sex:sexSel,fur:{...PRESETS[preIdx].fur},adult:true,x:50});
  S.cats.push(c);S.sel=c.id;S.nick=c.name+"네 집";save();startGame();
  say(c,`안녕! 난 ${c.name}야 냥~`);log("산책하다 보면 길냥이를 만날 수 있어요 🐾");
};
function startGame(){
  $("setup").hidden=true;$("game").hidden=false;
  const away=Math.min((Date.now()-S.last)/1000,8*3600);
  if(away>60) S.cats.forEach(c=>{tickCat(c,away,.25);});
  S.last=Date.now();
  S.cats.forEach(c=>{if(c.preg&&Date.now()>=c.preg)birth(c);});
  render();
  if(away>600) log(`${away>=3600?Math.round(away/3600)+"시간":Math.round(away/60)+"분"} 동안 다들 기다렸대요!`);
  if(!window._loopId) window._loopId=setInterval(loop,1000);
  setTimeout(townInit,300);
}
function askReset(){
  $("resetWrap").innerHTML=`정말 처음부터 할까요? <button id="yes">네</button> <button id="no">아니요</button>`;
  $("yes").onclick=()=>{try{localStorage.removeItem(KEY);localStorage.removeItem(OLD);}catch(e){}location.reload();};
  $("no").onclick=()=>{$("resetWrap").innerHTML=`<button id="resetBtn">새로 시작</button>`;$("resetBtn").onclick=askReset;};
}
$("resetBtn").onclick=askReset;

S=load()||migrate();
if(S&&S.cats&&S.cats.length){fixState(S);if(!S.sel)S.sel=S.cats[0].id;startGame();}else{S=null;showSetup();}
cloudState="off";
</script>
